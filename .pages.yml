# Pages CMS configuration for Office Impact.
# One unified content type is used for stories, events, webinars and recaps.
# Keep this file at the repository root as .pages.yml

media:
  input: media
  output: media
  rename: safe
  categories: [image]
  extensions: [jpg, jpeg, png, webp]

settings:
  content:
    merge: true

content:
  - name: entries
    label: Entries
    type: file
    path: content/entries.json
    format: json
    list: true
    fields:
      - name: id
        label: Entry ID
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Stable technical ID, for example workplace-stress-webinar-2026.

      - name: title
        label: Default title
        type: string
        required: true
        description: Fallback title used when a calendar or post title is blank.

      - name: show_in_calendar
        label: Show in calendar
        type: boolean
        description: Turn on for events, webinars, meetups and other dated activities.

      - name: show_in_posts
        label: Show in stories / highlights
        type: boolean
        description: Turn on when the entry should appear in the Stories section.

      - name: featured_post
        label: Featured post
        type: boolean
        description: Only applies when Show in stories / highlights is enabled. The newest featured entry gets the large homepage card.

      - name: published
        label: Published
        type: boolean
        description: Hidden entries remain in the public repository; do not use for confidential drafts.

      - name: calendar_title
        label: Calendar title
        type: string
        description: Optional shorter title for the calendar. If blank, Default title is used.

      - name: post_title
        label: Post title
        type: string
        description: Optional editorial title for Stories. If blank, Default title is used.

      - name: publication_date
        label: Publication date
        type: date
        description: Date shown on the post. Recommended when Show in stories / highlights is enabled.

      - name: category
        label: Post category
        type: select
        options:
          values: [Community, Learning, Perspective, News, Webinar, Event recap]

      - name: post_summary
        label: Post short summary
        type: text
        description: Short text shown on the homepage story card.

      - name: post_body
        label: Post full content
        type: rich-text
        options:
          format: html
          media: false
          switcher: false

      - name: post_image
        label: Post image
        type: image
        description: Story image. Featured posts use it prominently; other posts use a small thumbnail and the full image in detail view.
        options:
          path: stories
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: post_image_alt
        label: Post image description
        type: string
        description: Short accessibility description. If blank, the post title is used.

      - name: source
        label: Source label
        type: string
        description: For example LinkedIn.

      - name: source_url
        label: Source / LinkedIn URL
        type: string
        description: Optional https:// link to the original story or source.

      - name: event_date
        label: Event date
        type: date
        description: Required in practice when Show in calendar is enabled.

      - name: event_time
        label: Event time
        type: string
        description: For example 09:00-17:00 or 11:00 CET.

      - name: event_type
        label: Event type
        type: select
        options:
          values: [Summit, Webinar, Community meetup, Roundtable, Workshop, Online event, Other]

      - name: event_summary
        label: Event short summary
        type: text
        description: Short event-specific description.

      - name: event_details
        label: Event details
        type: rich-text
        description: Event-specific content. For a past event, the post content is preferred when available.
        options:
          format: html
          media: false
          switcher: false

      - name: event_location
        label: Venue / city
        type: string
        description: For example DB55, Amsterdam or Online.

      - name: address
        label: Physical address
        type: string
        description: Exact street address. Used for future-event map display.

      - name: map_query
        label: Map location override
        type: string
        description: Optional. Use only if Google Maps does not resolve the physical address correctly. Enter a place name, address or coordinates.

      - name: venue_image
        label: Future event venue image
        type: image
        description: Optional photo of the venue/building. Shown only for current or future events.
        options:
          path: events
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: event_image
        label: Past event photo
        type: image
        description: Optional photo from the actual event. Used for past-event detail instead of the map and venue image.
        options:
          path: events
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: event_image_alt
        label: Event photo description
        type: string
        description: Short accessibility description of the past-event photo.

      - name: registration_url
        label: Event details / registration URL
        type: string
        description: Optional https:// link. Shown for current and future events.

    operations:
      create: true
      rename: false
      delete: true

  - name: people
    label: People
    type: file
    path: content/people.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: role
        label: Role
        type: string

      - name: organization
        label: Organisation
        type: string

      - name: office_impact_role
        label: Role in Office Impact
        type: string
        description: Optional community role, for example Founder, Core team, Host, Ambassador or Contributor.

      - name: bio
        label: Short bio - homepage
        type: text
        description: A concise introduction for the People card on the main page.

      - name: bio_long
        label: Full bio - profile detail
        type: text
        description: Optional longer biography shown when the profile is opened. If blank, the short bio is used.

      - name: linkedin_url
        label: LinkedIn URL
        type: string
        description: Use an https:// URL.

      - name: image
        label: Profile image
        type: image
        description: Upload or select an image, then save the person record.
        options:
          path: people
          categories: [image]
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: featured
        label: Featured
        type: boolean

      - name: published
        label: Published
        type: boolean

    operations:
      create: true
      rename: false
      delete: true
